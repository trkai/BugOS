name: BugOS ROM Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'URL of the ROM to build'
        required: true

jobs:
  Initialize:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
      BUILDER_NAME: "iabi"
      BUILDER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Clean All Unused file,application
        run: |
          docker rmi `docker images -q` || true
          sudo apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell mysql* php* || true
          sudo apt-get -y autoremove --purge || true
          sudo apt-get -y autoclean || true
          sudo apt-get clean || true

      # Dọn triệt để trạng thái dpkg còn sót lại của các gói vừa purge ở trên
      # (đặc biệt là php8.3-fpm hay bị kẹt "half-configured" khiến mọi lệnh apt sau đó fail).
      - name: Fix broken package state (dpkg)
        run: |
          sudo dpkg --configure -a || true
          sudo apt-get -y purge php8.3-fpm php8.3-common php8.3-cli php8.3-cgi php8.3-phpdbg 2>/dev/null || true
          sudo rm -rf /etc/php /usr/share/dotnet /etc/mysql
          sudo apt-get update
          sudo apt-get install -f -y || true

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Start Notify
        run: |
          pip install requests
          python notify.py start "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Set up Time
        run: |
          echo "Setting Vienam timezone"
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh

      - name: Install OpenJDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Stuff
        run: |
          sudo bash setup.sh

      - name: Giving permission
        run: |
          sudo chmod 777 -R *

      - name: Build ROM...
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          sudo -E bash build.sh "$INPUT_URL" "${{ github.repository }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Pack ROM...
        run: |
          python notify.py pack "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"
          sudo bash packROM.sh

      # uploadROM.sh giờ chỉ đóng gói zip flashable (đã bỏ rclone/Google Drive).
      - name: Upload ROM...
        run: |
          python notify.py upload "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"
          sudo -E bash uploadROM.sh

      # ---------------------------------------------------------
      # BƯỚC MỚI: TẢI ROM LÊN GOFILE.IO
      # ---------------------------------------------------------
      - name: Upload ROM to Gofile.io
        if: success()
        id: upload_gofile
        run: |
          # 1. Lấy địa chỉ máy chủ Gofile
          SERVER=$(curl -s "https://api.gofile.io/servers" | jq -r '.data.servers[0].name')
          
          # 2. Định nghĩa file ROM ZIP
          ROM_ZIP_PATH="out/$(cat bin/ddevice/output_zip.txt)"
          echo "Đang upload $ROM_ZIP_PATH lên server $SERVER..."
          
          # 3. Gửi lệnh tải lên
          UPLOAD_RESP=$(curl -s -F "file=@$ROM_ZIP_PATH" -F "token=${{ env.GOFILE_TOKEN }}" "https://$SERVER.gofile.io/contents/uploadfile")
          
          # 4. Trích xuất link trả về
          DOWNLOAD_LINK=$(echo$UPLOAD_RESP | jq -r '.data.downloadPage')
          
          # 5. Lưu link vào biến môi trường để bước sau sử dụng
          echo "GOFILE_LINK=$DOWNLOAD_LINK" >> $GITHUB_ENV
          echo "Upload hoàn tất: $DOWNLOAD_LINK"

      - name: Success Notification
        if: success()
        run: |
          # Truyền link tải (GOFILE_LINK) thay vì đường dẫn local vào tham số thứ 7
          python notify.py success "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}" "${{ env.GOFILE_LINK }}"

      - name: Failure Notification
        if: failure()
        run: |
          python notify.py fail "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Cleanup
        if: always()
        run: |
          sudo rm -rf out build
