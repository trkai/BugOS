name: BugOS ROM Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'URL'
        required: true

jobs:
  Initialize:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      ARCHIVE_ACCESS_KEY: ${{ secrets.ARCHIVE_ACCESS_KEY }}
      ARCHIVE_SECRET_KEY: ${{ secrets.ARCHIVE_SECRET_KEY }}
      BUILDER_NAME: "iabi"
      BUILDER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Clean All Unused file,application
        run: |
          docker rmi `docker images -q` || true
          sudo apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell mysql* php* || true
          sudo apt-get -y autoremove --purge || true
          sudo apt-get -y autoclean || true
          sudo apt-get clean || true

      - name: Fix broken package state (dpkg)
        run: |
          sudo dpkg --configure -a || true
          sudo apt-get -y purge php8.3-fpm php8.3-common php8.3-cli php8.3-cgi php8.3-phpdbg 2>/dev/null || true
          sudo rm -rf /etc/php /usr/share/dotnet /etc/mysql
          sudo apt-get update
          sudo apt-get install -f -y || true

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Start Notify
        run: |
          pip install requests internetarchive
          python notify.py start "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Set up Time
        run: |
          echo "Setting Vienam timezone"
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh

      - name: Install OpenJDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Stuff
        run: |
          sudo bash setup.sh

      - name: Giving permission
        run: |
          sudo chmod 777 -R *

      - name: Build ROM...
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          sudo -E bash build.sh "$INPUT_URL" "${{ github.repository }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Pack ROM...
        run: |
          python notify.py pack "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"
          sudo bash packROM.sh

      - name: Upload ROM...
        run: |
          python notify.py upload "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"
          sudo -E bash uploadROM.sh

      - name: Upload ROM to Archive.org
        if: success()
        run: |
          export ROM_ZIP_PATH="out/$(cat bin/ddevice/output_zip.txt)"
          python3 - <<'PYEOF'
import os
import internetarchive

rom_zip_path = os.environ.get("ROM_ZIP_PATH", "")
build_id = os.environ.get("TELEGRAM_BUILD_ID", "unknown")
access_key = os.environ.get("ARCHIVE_ACCESS_KEY", "")
secret_key = os.environ.get("ARCHIVE_SECRET_KEY", "")

if not rom_zip_path or not os.path.exists(rom_zip_path):
    print("Lỗi: Không tìm thấy file ROM zip để upload.")
    exit(0)

file_name = os.path.basename(rom_zip_path)
identifier = f"bugos_rom_{build_id}".lower()

print(f"Đang upload {file_name} lên archive.org với định danh: {identifier}...")
try:
    internetarchive.upload(
        identifier,
        files=[rom_zip_path],
        access_key=access_key,
        secret_key=secret_key,
        metadata={"title": f"BugOS ROM Build {build_id}", "mediatype": "software"},
        retries=3,
    )
    download_link = f"https://archive.org/download/{identifier}/{file_name}"
    print(f"Upload thành công! Link tải: {download_link}")

    with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
        f.write(f"ARCHIVE_LINK={download_link}\n")
except Exception as e:
    print(f"Lỗi khi upload lên Archive: {e}")
PYEOF

      - name: Success Notification
        if: success()
        run: |
          # Bỏ parameter thứ 7 đi, file notify.py sẽ tự đọc env ARCHIVE_LINK
          python notify.py success "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Failure Notification
        if: failure()
        run: |
          python notify.py fail "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Cleanup
        if: always()
        run: |
          sudo rm -rf out build
          
