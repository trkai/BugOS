name: BugOS ROM Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'URL'
        required: true

jobs:
  Initialize:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      BUILDER_NAME: "iabi"
      BUILDER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 4096
          root-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Start Notify
        run: |
          pip install requests
          python notify.py start "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Set up Time
        run: |
          echo "Setting Vietnam timezone"
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh

      - name: Install OpenJDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Stuff
        run: |
          sudo bash setup.sh

      - name: Giving permission
        run: |
          sudo chmod 777 -R *

      - name: Build ROM...
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          sudo -E bash build.sh "$INPUT_URL" "${{ github.repository }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Pack ROM...
        run: |
          python notify.py pack "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"
          sudo bash packROM.sh

      - name: Upload ROM...
        run: |
          python notify.py upload "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"
          sudo -E bash uploadROM.sh

      - name: Upload ROM to Gofile.io
        if: success()
        continue-on-error: true
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          ROM_ZIP_PATH="out/$(cat bin/ddevice/output_zip.txt)"
          if [ ! -f "$ROM_ZIP_PATH" ]; then
            echo "Không thấy file ROM: $ROM_ZIP_PATH"
            exit 0
          fi

          df -h /
          free -h

          AUTH=()
          [ -n "$GOFILE_TOKEN" ] && AUTH=(-H "Authorization: Bearer $GOFILE_TOKEN")

          LINK=""
          for i in 1 2 3; do
            RES=$(curl -sS --max-time 3600 "${AUTH[@]}" \
                  -F "file=@${ROM_ZIP_PATH}" https://upload.gofile.io/uploadfile) || RES=""
            echo "Lần $i: status=$(echo "$RES" | jq -r '.status' 2>/dev/null)"
            LINK=$(echo "$RES" | jq -r '.data.downloadPage // empty' 2>/dev/null)
            [ -n "$LINK" ] && break
            sleep 10
          done

          if [ -n "$LINK" ]; then
            echo "Upload thành công! Link tải: $LINK"
            echo "DOWNLOAD_LINK=$LINK" >> "$GITHUB_ENV"
          else
            echo "Upload Gofile thất bại"
          fi

      - name: Success Notification
        if: success()
        run: |
          python notify.py success "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Failure Notification
        if: failure()
        run: |
          python notify.py fail "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Cleanup
        if: always()
        run: |
          sudo rm -rf out build
